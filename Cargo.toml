[workspace]
resolver = "2"
members = [
    "crates/ghostlink-core",
    "crates/ghostlink-signal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sayan9168/Ghostlink"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = "deny"
