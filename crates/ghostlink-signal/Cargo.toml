[package]
name = "ghostlink-signal"
description = "Zero-log, RAM-only blind WebSocket rendezvous server and ephemeral TURN HMAC credential minter for GhostLink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ghostlink-core = { path = "../ghostlink-core" }

# Async HTTP/1.1 + WebSocket rendezvous router
axum = { version = "0.8.1", features = ["ws"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }

# Zero-copy frame buffers & URL-safe / Standard Base64 codecs
bytes = "1.9.0"
base64 = "0.22.1"

# Ephemeral IP-blinding (HMAC-SHA256) & coturn REST API time-limited tokens (HMAC-SHA1)
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.8"
rand = "0.8.5"

# JSON responses for TURN ICE server descriptors & zeroization of TURN shared secrets
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.17"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
tokio-tungstenite = "0.26.1"
